name: Python Unit Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - test_report.md
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest and generate test_report.md
        id: pytest
        run: python -m pytest -v tests
        continue-on-error: true

      - name: Upload test report as Actions artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report
          path: test_report.md
          if-no-files-found: warn

      - name: Commit report to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if [ ! -f test_report.md ]; then
            echo "No test report generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test_report.md
          if ! git diff --cached --quiet; then
            git commit -m "auto: update test report [skip ci]"
            git push
          fi

      - name: Fail workflow if pytest failed
        if: steps.pytest.outcome != 'success'
        run: exit 1
